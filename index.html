<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bytescale Music Feed</title>
  <script src="https://js.bytescale.com/upload-widget/v4"></script>
  <style>
    body { font-family: Arial; background: #111; color: #fff; margin:0; padding:20px; }
    h1 { color: #ff6a00; }
    button { padding: 10px 20px; border:none; background:#ff6a00; color:white; cursor:pointer; border-radius:5px; margin-bottom:20px; }
    input { padding: 8px; width:250px; border-radius:5px; border:none; margin-bottom:20px; }
    .song { background:#222; padding:12px; border-radius:8px; margin-bottom:10px; }
    .song b { display:block; margin-bottom:5px; }
  </style>


  <h1>🎵 Bytescale Music Feed</h1>

  <button id="uploadBtn">Upload MP3</button>
  <br>
  <input id="search" placeholder="Search by name...">

  <div id="feed">Loading...</div>

  <script>
    const publicKey = "public_223k2W8DK1rmsZEUvQLrPANTVvkp"; // Your public key
    const backendUrl = "https://bold-limit-a048.aflory820.workers.dev/"; // Your Cloudflare Worker URL

    // Upload MP3
    document.getElementById("uploadBtn").onclick = () => {
      Bytescale.UploadWidget.open({
        apiKey: publicKey,
        directoryPath: "/music/",
        maxFileCount: 1,
        mimeTypes: ["audio/mpeg"]
      }).then(files => {
        if(files.length) alert("Uploaded! Refresh the page to see it in the feed.");
      });
    };

    // Load feed from Cloudflare Worker
    async function loadFeed() {
      const feed = document.getElementById("feed");
      try {
        const res = await fetch(backendUrl);
        const files = await res.json();
        feed.innerHTML = "";

        if(!files.length) {
          feed.innerHTML = "No tracks uploaded yet.";
          return;
        }

        files.forEach(file => {
          const div = document.createElement("div");
          div.className = "song";
          div.dataset.name = file.fileName.toLowerCase();
          div.innerHTML = `
            <b>${file.fileName}</b>
            <audio controls src="${file.fileUrl}"></audio>
          `;
          feed.appendChild(div);
        });
      } catch(err) {
        feed.innerHTML = "Failed to load feed.";
        console.error(err);
      }
    }

    loadFeed();

    // Search functionality
    document.getElementById("search").oninput = () => {
      const q = document.getElementById("search").value.toLowerCase();
      document.querySelectorAll(".song").forEach(s => {
        s.style.display = s.dataset.name.includes(q) ? "block" : "none";
      });
    };
  </script>


<script src="./script.js"></script></body></html>
